[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rvr-framework"
version = "2.0.0"
description = "RVR - Ryxvoid Recon Framework: conditional-trigger reconnaissance and reporting for HTB, CTFs, and authorized pentests"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ryan Dube" }]
keywords = ["pentest", "recon", "htb", "ctf", "cpts", "oscp", "enumeration"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

dependencies = [
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "reportlab>=4.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# AI analysis providers - install whichever you plan to use
ai = [
    "google-genai>=0.3.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
]
ai-min = [
    "google-genai>=0.3.0",
    "openai>=1.50.0",
]

[project.scripts]
rvr = "rvr.cli:main"

[tool.setuptools.packages.find]
include = ["rvr*"]

[tool.setuptools.package-data]
"rvr.config" = ["*.yaml"]
